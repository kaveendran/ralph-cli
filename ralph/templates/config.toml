# ralph harness settings for this project (docs/meta-harness-plan.md in ralph-cli).

[runner]
model_build = "sonnet"
model_plan = "opus"
max_turns = 200            # per iteration
max_budget_usd = 30        # per iteration (Claude Code's own estimate; leave headroom)
timeout_minutes = 90       # per iteration
compact_window = 200000    # auto-compact here instead of near the 1M-token limit
setting_sources = "project,local"
# How much Claude may do without asking:
#   bypass    skip prompts; guardrail hooks stop accidents (attended runs on your machine)
#   container the same, but only inside a container (unattended or overnight runs)
#   strict    only an allowlist runs: file tools, the gate commands, and `allow` below
#   sandbox   Claude Code's OS sandbox: commands write only to the project, reach only sandbox_domains
permissions = "bypass"
# allow = ["Bash(npm test *)"]               # strict: more commands the agent may run
# sandbox_domains = ["pypi.org"]             # sandbox: hosts its commands may reach
# sandbox_excluded = ["docker compose *"]    # sandbox: commands that run outside it
# claude_version = "{{CLAUDE_VERSION}}"   # pin Claude Code; the loop stops if it changes

[verify]
review = "p0-and-large"    # off | p0-and-large | all: which units get the read-only review
max_attempts = 3
frozen = []                # globs the agent must never change, e.g. ["migrations/versions/**"]
health = ""                # a quick command before each iteration; if it fails, repairing comes first
done = ""                  # must pass before a CR counts as complete
paid_gates = {{PAID_GATES}}

# The commands the harness runs itself to decide whether a unit is done.
[verify.gates]
{{GATES}}

# Which gates run for which unit type ("default" covers the rest).
[verify.by_type]
{{BY_TYPE}}

[loop]
max_stalls = 3             # iterations in a row that change nothing
tag_format = "{cr}-done"   # local tag when a CR converges; "" turns it off
max_cost_usd = 0           # stop a run once it has spent this much in total (0: no limit; --run-budget)
on_usage_limit = "stop"    # or "wait": sleep until the usage limit resets, then go on (waits don't count toward --max)
max_wait_hours = 6         # wait: stop instead when the reset is further off

# Size budgets in lines, checked at start and by `ralph memory lint`.
[memory]
claude_md_lines = 200
rule_lines = 50
skill_lines = 500
learnings_in_pack = 5      # unreviewed lessons per unit pack

# Working with a team. Only `ralph sync` and `ralph sync push` touch the remote, and only when you run them.
[team]
remote = "origin"
# branch = "main"          # the branch you share; default: your current branch's upstream
ledger = true              # record what each unit changed in .ralph/ledger/, committed with it
impact_days = 7            # teammates' changes this recent are checked against each unit
stale_sync_hours = 12      # remind you to `ralph sync` when your last fetch is older
claims = false             # true: only build units you've claimed (`ralph claim`); --mine does it per run
lease_hours = 48           # a claim expires after this long unless renewed
# refs = "refs/heads/ralph-claims"   # if your git host rejects custom refs (default "refs/ralph")

# Tell you when the loop needs you. Best-effort: a failure never changes what the loop does.
[notify]
# webhook = "https://hooks.slack.com/services/…"   # a JSON POST with a `text` field
# command = "terminal-notifier -message 'ralph needs you'"   # gets the event as JSON on stdin
events = ["blocked", "stopped", "complete", "usage_limit"]

# Optional: Claude Code's own OpenTelemetry export for every run ralph starts.
# Credentials go in OTEL_EXPORTER_OTLP_HEADERS in your environment, not here.
# [telemetry]
# otlp_endpoint = "http://localhost:4317"
# protocol = "grpc"        # grpc | http/json | http/protobuf
# team = "payments"        # sent as the team.id attribute
